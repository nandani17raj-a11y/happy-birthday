<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(#ffe6f0,#fff);
    text-align:center;
}

header{
    padding:40px;
}

h1{
    color:#ff2d75;
    font-size:3em;
}

p{
    font-size:20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.message{
    max-width:700px;
    margin:40px auto;
    font-size:20px;
    line-height:1.7;
    padding:20px;
}

footer{
    padding:30px;
    font-size:18px;
    color:#777;
}
</style>

</head>
<body>

<header>
<h1>Happy Birthday ❤️</h1>
<p>To the love of my life</p>
</header>

<div class="gallery">
<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
<img src="6.jpg">
<img src="7.jpg">
<img src="8.jpg">
</div>

<div class="message">
Every picture here tells a story, but my favorite story is the one we're still writing together.

No matter how many miles separate us today, you are always the closest to my heart.

Happy Birthday, my love. ❤️
</div>

<footer>
Made with ❤️ just for you
</footer>

</body>
</html>
